version: "3.9"

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: secinsight
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-secinsight}
      POSTGRES_DB: secinsight
    volumes:
      - secinsight_pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U secinsight"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg://secinsight:${POSTGRES_PASSWORD:-secinsight}@db:5432/secinsight
      CORS_ORIGINS: http://localhost:5173,http://localhost:8080
      UPLOAD_DIR: /data/uploads
      REPORTS_DIR: /data/reports
    volumes:
      - secinsight_data:/data
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    depends_on:
      - backend
    ports:
      - "8080:80"

volumes:
  secinsight_pgdata:
  secinsight_data:
