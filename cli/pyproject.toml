[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "secinsight-cli"
version = "0.1.0"
description = "SecInsight AI command-line interface"
requires-python = ">=3.10"
dependencies = [
    "secinsight-core",
    "typer>=0.12",
    "rich>=13.7",
]

[project.scripts]
secinsight = "secinsight_cli.main:app"

[tool.setuptools]
packages = ["secinsight_cli"]
